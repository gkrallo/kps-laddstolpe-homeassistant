name: KPs Laddstolpe
version: "0.2.1"
slug: kps_laddstolpe
description: Laddstolpe med spotprisdebitering. Fas 2 - backend i simuleringslage.
url: https://github.com/gkrallo/kps-laddstolpe-homeassistant
arch:
  - aarch64
  - amd64

init: false
startup: application
boot: auto

ports:
  "8443/tcp": 8443
ports_description:
  "8443/tcp": Publik gastsida - vidarebefordra denna port i routern

ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: Laddstolpe
panel_admin: true

watchdog: "tcp://[HOST]:[PORT:8443]"

map:
  - ssl

options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  location_name: Gräshagen 4
  price_zone: SE3
  simulation: true
  log_level: info

schema:
  ssl: bool
  certfile: str
  keyfile: str
  location_name: str
  price_zone: list(SE1|SE2|SE3|SE4)
  simulation: bool
  log_level: list(debug|info|warning|error)
