name: KPs Laddstolpe
version: "0.9.0"
slug: kps_laddstolpe
description: Laddstolpe med spotprisdebitering, SMS-kvitto och Swish.
url: https://github.com/gkrallo/kps-laddstolpe-homeassistant
arch:
  - aarch64
  - amd64

# Vi använder ingen s6-init, servern startas direkt
init: false
startup: application
boot: auto

# Gästsidan. Denna port vidarebefordras i routern.
ports:
  "8443/tcp": 8443
ports_description:
  "8443/tcp": Publik gästsida - vidarebefordra denna port i routern

# Adminfliken. Nås BARA inifrån Home Assistant, aldrig utifrån.
ingress: true
ingress_port: 8099
panel_icon: mdi:ev-station
panel_title: Laddstolpe
panel_admin: true

# Supervisor startar om tillägget om porten slutar svara
watchdog: "tcp://[HOST]:[PORT:8443]"

# Läsrätt till certifikaten som DuckDNS-tillägget skapar
map:
  - ssl

# Rätt att anropa Home Assistants tjänste-API genom Supervisor. Används för att
# larma när en schemalagd start inte gick att genomföra — ett schema som tyst
# uteblir är värre än inget schema.
homeassistant_api: true

options:
  ssl: true
  certfile: fullchain.pem
  keyfile: privkey.pem
  location_name: Gräshagen 4
  price_zone: SE3
  mode: simulering
  easee_username: ""
  easee_password: ""
  easee_charger_id: ""
  easee_equalizer_id: ""
  sms_username: ""
  sms_password: ""
  sms_sender: KPsLadd
  swish_number: ""
  swish_name: ""
  public_host: ""
  log_level: info

schema:
  ssl: bool
  certfile: str
  keyfile: str
  location_name: str
  price_zone: list(SE1|SE2|SE3|SE4)
  mode: list(simulering|avlasning|skarp)
  easee_username: str?
  easee_password: password?
  easee_charger_id: str?
  easee_equalizer_id: str?
  sms_username: str?
  sms_password: password?
  sms_sender: str?
  swish_number: str?
  swish_name: str?
  public_host: str?
  log_level: list(debug|info|warning|error)
